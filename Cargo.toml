[package]
name = "RoadMapGenerator"
version = "0.2.0"
edition = "2024"

[package.metadata.winresource]
OriginalFilename = "RoadMapGenerator.exe"
LegalCopyright = "Copyright © 2026"

[dependencies]
slint = "1.17.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.17"
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"
png = "0.18"

[build-dependencies]
slint-build = "1.17.1"
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = true
